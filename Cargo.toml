[workspace]
resolver = "2"
members = ["crates/skillz-core", "crates/skillz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rliebling/skillz"

[workspace.dependencies]
skillz-core = { path = "crates/skillz-core" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tempfile = "3.14"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"
